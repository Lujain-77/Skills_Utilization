name: Skills Utilization CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  test:
    runs-on: self-hosted

    env:
      POSTGRES_DB: course_recommendation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_password
      DATABASE_URL: postgresql://postgres:ci_password@localhost:5433/course_recommendation_db
      SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start PostgreSQL
        run: |
          docker rm -f project3-ci-db 2>/dev/null || true

          docker run -d \
            --name project3-ci-db \
            -e POSTGRES_DB="$POSTGRES_DB" \
            -e POSTGRES_USER="$POSTGRES_USER" \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -p 5433:5432 \
            postgres:16

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker exec project3-ci-db pg_isready \
              -U "$POSTGRES_USER" \
              -d "$POSTGRES_DB"; then
              echo "PostgreSQL is ready"
              break
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Flask application
        run: |
          cd backend
          python -c "import app; print('Flask application imported successfully')"

      - name: Cleanup PostgreSQL
        if: always()
        run: |
          docker rm -f project3-ci-db 2>/dev/null || true


  trufflehog:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            trufflesecurity/trufflehog:latest \
            filesystem /repo \
            --json \
            > trufflehog-report.json 2>&1 || true

          echo "TruffleHog scan completed."

      - name: Upload TruffleHog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: trufflehog-report.json
          if-no-files-found: warn


  hadolint:
    needs: trufflehog
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: backend/Dockerfile
          output-file: hadolint-report.txt
          no-color: true

      - name: Upload Hadolint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hadolint-report
          path: hadolint-report.txt
          if-no-files-found: warn


  bandit:
    needs: hadolint
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r backend \
            -f txt \
            -o bandit-report.txt || true

          echo "Bandit scan completed."

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt
          if-no-files-found: warn


  build-and-push:
    needs: bandit
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t ghcr.io/lujain-77/skills_utilization:latest \
            .

      - name: Push backend image to GHCR
        run: |
          docker push ghcr.io/lujain-77/skills_utilization:latest


  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Check deployment directory
        run: |
          cd /home/aau/Desktop/project3/Skills_Utilization

          echo "Deployment directory:"
          pwd

          echo "Project contents:"
          ls -la

          echo "Docker Compose file:"
          ls -l docker-compose.yml

      - name: Get secrets from Vault
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          cd /home/aau/Desktop/project3/Skills_Utilization

          vault kv get -format=json kv/project3 | \
            jq -r '.data.data | to_entries[] | .key + "=" + .value' > .env

          chmod 600 .env

          echo "Vault secrets retrieved successfully."

      - name: Pull GHCR backend image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

          docker pull ghcr.io/lujain-77/skills_utilization:latest

      - name: Deploy application
        working-directory: /home/aau/Desktop/project3/Skills_Utilization
        run: |
          docker compose --env-file .env down
          docker compose --env-file .env up -d

      - name: Verify containers
        run: |
          docker ps
